<circle cx="18" cy="15" r="6" fill="#ff5f56"/>
<circle cx="38" cy="15" r="6" fill="#ffbd2e"/>
<circle cx="58" cy="15" r="6" fill="#27c93f"/>
<text x="569" y="19" fill="#8b949e" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle">mcpgraph:&#160;DROP&#160;TABLE&#160;blocked</text>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#c9d1d9" xml:space="preserve" style="white-space:pre">
<text x="16" y="57" style="animation-name:k0"><tspan fill="#7ee787">$&#160;</tspan><tspan fill="#ffffff">claude&#160;-p&#160;&quot;The&#160;demo&#160;database&#160;has&#160;junk&#160;data.&#160;Clean&#160;up&#160;the&#160;database:&#160;drop&#160;the&#160;users&#160;table.&quot;</tspan></text>
<text x="16" y="75" style="animation-name:k1">&#160;&#160;[DRAFT&#160;placeholder:&#160;the&#160;real&#160;Claude&#160;Code&#160;run&#160;is&#160;recorded&#160;after&#160;the&#160;hook&#160;lands]</text>
<text x="16" y="93" style="animation-name:k2">&#160;&#160;Claude&#160;wants&#160;to&#160;run:&#160;psql&#160;-c&#160;&quot;DROP&#160;TABLE&#160;users&quot;</text>
<text x="16" y="111" style="animation-name:k3">&#160;&#160;mcpgraph&#160;hook:&#160;DENY&#160;&#160;rule=block-destructive-sql&#160;&#160;(the&#160;command&#160;never&#160;ran)</text>
<text x="16" y="129" style="animation-name:k4"><tspan fill="#8b949e">#&#160;The&#160;same&#160;policy&#160;guards&#160;MCP&#160;servers:&#160;now&#160;through&#160;mcpgraph&#160;proxy.</tspan></text>
<text x="16" y="147" style="animation-name:k5"><tspan fill="#8b949e">#&#160;MCP&#160;server:&#160;Postgres.&#160;Every&#160;tools/call&#160;goes&#160;through&#160;mcpgraph&#160;first.</tspan></text>
<text x="16" y="165" style="animation-name:k6"><tspan fill="#7ee787">$&#160;</tspan><tspan fill="#ffffff">mcpgraph&#160;proxy&#160;--server&#160;postgres&#160;--app&#160;&quot;Claude&#160;Desktop&quot;&#160;--&#160;npx&#160;-y&#160;@modelcontextprotocol/server-postgres@0.6.2&#160;&lt;postgres&#160;url&gt;</tspan></text>
<text x="16" y="183" style="animation-name:k7">&#160;&#160;initialized:&#160;example-servers/postgres</text>
<text x="16" y="201" style="animation-name:k8">&#160;&#160;tools:&#160;query</text>
<text x="16" y="219" style="animation-name:k9"><tspan fill="#8b949e">#&#160;a&#160;harmless&#160;query&#160;is&#160;allowed&#160;and&#160;forwarded</tspan></text>
<text x="16" y="237" style="animation-name:k10">&gt;&#160;tools/call&#160;query&#160;{&quot;sql&quot;:&quot;SELECT&#160;count(*)&#160;FROM&#160;users&quot;}</text>
<text x="16" y="255" style="animation-name:k11">&#160;&#160;allowed&#160;-&gt;&#160;[&#160;&#160;&#160;{&#160;&#160;&#160;&#160;&#160;&quot;count&quot;:&#160;&quot;6&quot;&#160;&#160;&#160;}&#160;]</text>
<text x="16" y="273" style="animation-name:k12"><tspan fill="#8b949e">#&#160;the&#160;agent&#160;tries&#160;to&#160;clean&#160;up&#160;the&#160;database</tspan></text>
<text x="16" y="291" style="animation-name:k13">&gt;&#160;tools/call&#160;query&#160;{&quot;sql&quot;:&quot;DROP&#160;TABLE&#160;users&quot;}</text>
<text x="16" y="309" style="animation-name:k14">&#160;&#160;DENIED&#160;&#160;rule=block-destructive-sql&#160;-&gt;&#160;mcpgraph:&#160;this&#160;tool&#160;call&#160;was&#160;blocked&#160;by&#160;policy&#160;rule&#160;block-destructive-sql&#160;and&#160;was&#160;not&#160;run.&#160;Destructi</text>
<text x="16" y="327" style="animation-name:k15"><tspan fill="#8b949e">#&#160;every&#160;decision&#160;is&#160;in&#160;the&#160;audit&#160;log</tspan></text>
<text x="16" y="345" style="animation-name:k16"><tspan fill="#7ee787">$&#160;</tspan><tspan fill="#ffffff">mcpgraph&#160;events</tspan></text>
<text x="16" y="363" style="animation-name:k17"><tspan fill="#79c0ff" font-weight="bold">DECISIONS&#160;(2)</tspan></text>
<text x="16" y="381" style="animation-name:k18"><tspan fill="#79c0ff" font-weight="bold">TIME&#160;(UTC)&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;VERDICT&#160;&#160;RULE&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;SOURCE&#160;&#160;AGENT&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;TOOL&#160;&#160;&#160;ACTION</tspan></text>
<text x="16" y="399" style="animation-name:k19">2026-10-18&#160;08:06:48&#160;&#160;ALLOW&#160;&#160;&#160;&#160;-&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;proxy&#160;&#160;&#160;postgres&#160;(Claude&#160;Desktop)&#160;&#160;query&#160;&#160;SELECT&#160;count(*)&#160;FROM&#160;users</text>
<text x="16" y="417" style="animation-name:k20">2026-10-18&#160;08:06:48&#160;&#160;DENY&#160;&#160;&#160;&#160;&#160;block-destructive-sql&#160;&#160;proxy&#160;&#160;&#160;postgres&#160;(Claude&#160;Desktop)&#160;&#160;query&#160;&#160;DROP&#160;TABLE&#160;users</text>
<text x="16" y="435" style="animation-name:k21"><tspan fill="#8b949e">#&#160;and&#160;the&#160;table&#160;is&#160;still&#160;there</tspan></text>
<text x="16" y="453" style="animation-name:k22"><tspan fill="#7ee787">$&#160;</tspan><tspan fill="#ffffff">psql&#160;-c&#160;'select&#160;count(*)&#160;from&#160;users'&#160;&#160;&#160;#&#160;inside&#160;the&#160;container</tspan></text>
<text x="16" y="471" style="animation-name:k23">&#160;count&#160;</text>
<text x="16" y="489" style="animation-name:k24">-------</text>
<text x="16" y="507" style="animation-name:k25">&#160;&#160;&#160;&#160;&#160;6</text>
<text x="16" y="525" style="animation-name:k26">(1&#160;row)</text>
<text x="16" y="543" style="animation-name:k27"></text>
<text x="16" y="561" style="animation-name:k28">users&#160;table&#160;still&#160;exists.</text>
</g>
