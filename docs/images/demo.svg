<rect width="1138" height="834" rx="8" fill="#0d1117"/>
<rect width="1138" height="30" rx="8" fill="#161b22"/><rect y="22" width="1138" height="8" fill="#161b22"/>
<circle cx="18" cy="15" r="6" fill="#ff5f56"/>
<circle cx="38" cy="15" r="6" fill="#ffbd2e"/>
<circle cx="58" cy="15" r="6" fill="#27c93f"/>
<text x="569" y="19" fill="#8b949e" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" text-anchor="middle">mcpgraph:&#160;DROP&#160;TABLE&#160;blocked</text>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#c9d1d9" xml:space="preserve" style="white-space:pre">
<text x="16" y="57" style="animation-name:k0"><tspan fill="#8b949e">#&#160;Claude&#160;Code,&#160;with&#160;`mcpgraph&#160;hook&#160;claude-code`&#160;as&#160;its&#160;PreToolUse&#160;hook</tspan></text>
<text x="16" y="75" style="animation-name:k1"><tspan fill="#7ee787">$&#160;</tspan><tspan fill="#ffffff">claude&#160;-p&#160;&quot;This&#160;is&#160;a&#160;throwaway&#160;demo&#160;database&#160;and&#160;I&#160;have&#160;a&#160;backup.&#160;The&#160;users&#160;table&#160;is&#160;junk:</tspan></text>
<text x="16" y="93" style="animation-name:k2">&#160;&#160;&#160;&#160;clean&#160;up&#160;the&#160;database&#160;by&#160;dropping&#160;the&#160;users&#160;table&#160;(CASCADE&#160;is&#160;fine).&#160;Don't&#160;ask&#160;me&#160;first,</text>
<text x="16" y="111" style="animation-name:k3">&#160;&#160;&#160;&#160;just&#160;run&#160;it&#160;with&#160;psql.&quot;&#160;--allowedTools&#160;Bash</text>
<text x="16" y="129" style="animation-name:k4">I&#160;didn't&#160;drop&#160;the&#160;`users`&#160;table.&#160;A&#160;PreToolUse&#160;hook&#160;(`mcpgraph`,&#160;rule&#160;`block-destructive-sql`)</text>
<text x="16" y="147" style="animation-name:k5">blocked&#160;the&#160;command&#160;before&#160;it&#160;ran.&#160;That&#160;rule&#160;blocks&#160;`DROP&#160;TABLE`,&#160;`DROP&#160;DATABASE/SCHEMA`,</text>
<text x="16" y="165" style="animation-name:k6">`TRUNCATE`&#160;and&#160;`DELETE`&#160;without&#160;a&#160;li…</text>
<text x="16" y="183" style="animation-name:k7">I&#160;haven't&#160;tried&#160;to&#160;get&#160;around&#160;the&#160;hook,&#160;for&#160;example&#160;by&#160;wrapping&#160;the&#160;statement&#160;differently,</text>
<text x="16" y="201" style="animation-name:k8">because&#160;that&#160;guardrail&#160;is&#160;part&#160;of&#160;your&#160;setup.&#160;…</text>
<text x="16" y="219" style="animation-name:k9"><tspan fill="#7ee787">$&#160;</tspan><tspan fill="#ffffff">mcpgraph&#160;events&#160;--verdict&#160;deny</tspan></text>
<text x="16" y="237" style="animation-name:k10"><tspan fill="#79c0ff" font-weight="bold">DECISIONS&#160;(1)</tspan></text>
<text x="16" y="255" style="animation-name:k11"><tspan fill="#79c0ff" font-weight="bold">TIME&#160;(UTC)&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;VERDICT&#160;&#160;RULE&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;SOURCE&#160;&#160;AGENT&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;TOOL&#160;&#160;ACTION</tspan></text>
<text x="16" y="273" style="animation-name:k12">2026-10-18&#160;08:09:27&#160;&#160;DENY&#160;&#160;&#160;&#160;&#160;block-destructive-sql&#160;&#160;hook&#160;&#160;&#160;&#160;claude-code&#160;(Claude&#160;Code)&#160;&#160;Bash&#160;&#160;psql&#160;-c&#160;'DROP&#160;TABLE&#160;users&#160;CASCADE;'&#160;…</text>
<text x="16" y="291" style="animation-name:k13"><tspan fill="#7ee787">$&#160;</tspan><tspan fill="#ffffff">psql&#160;-c&#160;'select&#160;count(*)&#160;from&#160;users'</tspan></text>
<text x="16" y="309" style="animation-name:k14">&#160;count</text>
<text x="16" y="327" style="animation-name:k15">-------</text>
<text x="16" y="345" style="animation-name:k16">&#160;&#160;&#160;&#160;&#160;6</text>
<text x="16" y="363" style="animation-name:k17">users&#160;table&#160;still&#160;exists.</text>
<text x="16" y="381" style="animation-name:k18"><tspan fill="#8b949e">#&#160;The&#160;same&#160;policy&#160;guards&#160;MCP&#160;servers:&#160;now&#160;through&#160;mcpgraph&#160;proxy.</tspan></text>
<text x="16" y="399" style="animation-name:k19"><tspan fill="#8b949e">#&#160;MCP&#160;server:&#160;Postgres.&#160;Every&#160;tools/call&#160;goes&#160;through&#160;mcpgraph&#160;first.</tspan></text>
<text x="16" y="417" style="animation-name:k20"><tspan fill="#7ee787">$&#160;</tspan><tspan fill="#ffffff">mcpgraph&#160;proxy&#160;--server&#160;postgres&#160;--app&#160;&quot;Claude&#160;Desktop&quot;&#160;--&#160;npx&#160;-y&#160;@modelcontextprotocol/server-postgres@0.6.2&#160;&lt;postgres&#160;url&gt;</tspan></text>
<text x="16" y="435" style="animation-name:k21">&#160;&#160;initialized:&#160;example-servers/postgres</text>
<text x="16" y="453" style="animation-name:k22">&#160;&#160;tools:&#160;query</text>
<text x="16" y="471" style="animation-name:k23"><tspan fill="#8b949e">#&#160;a&#160;harmless&#160;query&#160;is&#160;allowed&#160;and&#160;forwarded</tspan></text>
<text x="16" y="489" style="animation-name:k24">&gt;&#160;tools/call&#160;query&#160;{&quot;sql&quot;:&quot;SELECT&#160;count(*)&#160;FROM&#160;users&quot;}</text>
<text x="16" y="507" style="animation-name:k25">&#160;&#160;allowed&#160;-&gt;&#160;[&#160;&#160;&#160;{&#160;&#160;&#160;&#160;&#160;&quot;count&quot;:&#160;&quot;6&quot;&#160;&#160;&#160;}&#160;]</text>
<text x="16" y="525" style="animation-name:k26"><tspan fill="#8b949e">#&#160;the&#160;agent&#160;tries&#160;to&#160;clean&#160;up&#160;the&#160;database</tspan></text>
<text x="16" y="543" style="animation-name:k27">&gt;&#160;tools/call&#160;query&#160;{&quot;sql&quot;:&quot;DROP&#160;TABLE&#160;users&quot;}</text>
<text x="16" y="561" style="animation-name:k28">&#160;&#160;DENIED&#160;&#160;rule=block-destructive-sql&#160;-&gt;&#160;mcpgraph:&#160;this&#160;tool&#160;call&#160;was&#160;blocked&#160;by&#160;policy&#160;rule&#160;block-destructive-sql&#160;and&#160;was&#160;not&#160;run.&#160;Destructi</text>
<text x="16" y="579" style="animation-name:k29"><tspan fill="#8b949e">#&#160;every&#160;decision&#160;is&#160;in&#160;the&#160;audit&#160;log</tspan></text>
<text x="16" y="597" style="animation-name:k30"><tspan fill="#7ee787">$&#160;</tspan><tspan fill="#ffffff">mcpgraph&#160;events</tspan></text>
<text x="16" y="615" style="animation-name:k31"><tspan fill="#79c0ff" font-weight="bold">DECISIONS&#160;(2)</tspan></text>
<text x="16" y="633" style="animation-name:k32"><tspan fill="#79c0ff" font-weight="bold">TIME&#160;(UTC)&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;VERDICT&#160;&#160;RULE&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;SOURCE&#160;&#160;AGENT&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;TOOL&#160;&#160;&#160;ACTION</tspan></text>
<text x="16" y="651" style="animation-name:k33">2026-10-18&#160;08:09:55&#160;&#160;ALLOW&#160;&#160;&#160;&#160;-&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;proxy&#160;&#160;&#160;postgres&#160;(Claude&#160;Desktop)&#160;&#160;query&#160;&#160;SELECT&#160;count(*)&#160;FROM&#160;users</text>
<text x="16" y="669" style="animation-name:k34">2026-10-18&#160;08:09:55&#160;&#160;DENY&#160;&#160;&#160;&#160;&#160;block-destructive-sql&#160;&#160;proxy&#160;&#160;&#160;postgres&#160;(Claude&#160;Desktop)&#160;&#160;query&#160;&#160;DROP&#160;TABLE&#160;users</text>
<text x="16" y="687" style="animation-name:k35"><tspan fill="#8b949e">#&#160;and&#160;the&#160;table&#160;is&#160;still&#160;there</tspan></text>
<text x="16" y="705" style="animation-name:k36"><tspan fill="#7ee787">$&#160;</tspan><tspan fill="#ffffff">psql&#160;-c&#160;'select&#160;count(*)&#160;from&#160;users'&#160;&#160;&#160;#&#160;inside&#160;the&#160;container</tspan></text>
<text x="16" y="723" style="animation-name:k37">&#160;count&#160;</text>
<text x="16" y="741" style="animation-name:k38">-------</text>
<text x="16" y="759" style="animation-name:k39">&#160;&#160;&#160;&#160;&#160;6</text>
<text x="16" y="777" style="animation-name:k40">(1&#160;row)</text>
<text x="16" y="795" style="animation-name:k41"></text>
<text x="16" y="813" style="animation-name:k42">users&#160;table&#160;still&#160;exists.</text>
</g>
