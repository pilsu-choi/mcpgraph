# Throwaway PostgreSQL for the mcpgraph DROP TABLE demo.
# DEMO ONLY: the credentials below are fake and the database holds fake rows.
# It listens on 127.0.0.1 only. Override the port with DEMO_PG_PORT.
name: mcpgraph-demo
services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: demo          # demo-only credential
      POSTGRES_PASSWORD: demo      # demo-only credential
      POSTGRES_DB: demo
    ports:
      - "127.0.0.1:${DEMO_PG_PORT:-55442}:5432"
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 1s
      timeout: 3s
      retries: 30
