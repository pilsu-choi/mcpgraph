# GoReleaser v2. `make release` runs a local snapshot build only; nothing
# is published.
version: 2

project_name: mcpgraph

before:
  hooks:
    - go mod tidy

builds:
  - id: mcpgraph
    main: ./cmd/mcpgraph
    binary: mcpgraph
    env:
      - CGO_ENABLED=0 # hard rule 5: static, pure-Go binaries
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  disable: true

# Build-only for now; publishing releases is a later decision.
release:
  disable: true
